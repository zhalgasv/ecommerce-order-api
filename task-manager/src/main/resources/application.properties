spring.application.name=task-manager
server.port=${SERVER_PORT:8082}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/task_manager}
spring.datasource.username=${DB_USERNAME:task_manager}
spring.datasource.password=${DB_PASSWORD:task_manager}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/master.yaml
springdoc.swagger-ui.path=/swagger-ui.html
